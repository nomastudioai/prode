name: Update World Cup 2026

# Refreshes live Elo from eloratings.net and regenerates predictions + README.
# Runs every day during the World Cup. Can also be triggered manually.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Update data and predictions
        run: bash scripts/actualizar.sh

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automatic update: live Elo + predictions ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
